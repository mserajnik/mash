name: Lint

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  shfmt:
    name: shfmt
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install shfmt
        uses: mfinelli/setup-shfmt@v4

      - name: Run shfmt
        run: shfmt -d -i 2 -ci bin/mash

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: shellcheck bin/mash

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run reuse lint
        uses: fsfe/reuse-action@v6
